<style>
:root{--e:#3A261C;--m:#5C3B2A;--n:#E9D8CA;--f:#FAF6F2;--c:#A97C56;--cl:#F6EEE7}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--f);color:var(--e);font-family:Jost,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:430px;margin:0 auto;padding:40px 16px 80px}
header{text-align:center;margin-bottom:24px}
.logo{font-family:"Bodoni Moda",serif;font-size:44px;line-height:.9}
.logo i{color:var(--m)}
header p{margin-top:14px;font-size:12px;letter-spacing:.2em;color:var(--c);text-transform:uppercase}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 16px;scrollbar-width:none;position:sticky;top:0;background:var(--f);z-index:2}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;padding:10px 18px;border-radius:999px;border:1.5px solid var(--n);background:transparent;font:400 14px Jost,sans-serif;letter-spacing:.04em;color:var(--m);white-space:nowrap;cursor:pointer}
.tabs button.on{background:var(--e);border-color:var(--e);color:var(--cl)}
.tabs button.feito{border-style:dashed}
.post{background:#fff;border:1.5px solid var(--n);border-radius:24px;padding:22px 18px;margin-bottom:22px}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 10px}
.num{white-space:nowrap}
.num{font-size:12px;letter-spacing:.2em;color:var(--c);text-transform:uppercase}
.st{font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:6px 12px;border-radius:999px;background:var(--n);color:var(--m);white-space:nowrap}
.st.ok{background:var(--e);color:var(--cl)}
h2{margin-top:10px;font-family:"Bodoni Moda",serif;font-weight:400;font-size:32px;line-height:1.05}
h2 i{color:var(--m)}
.sec{margin-top:22px;font-size:11px;letter-spacing:.2em;color:var(--c);text-transform:uppercase;display:flex;align-items:center;gap:10px}
.sec::after{content:"";flex:1;height:1px;background:var(--n)}
.strip{margin-top:12px;display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px}
.strip figure{flex:none;width:72%;scroll-snap-align:start}
.strip img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:14px;display:block;border:1px solid var(--n);background:var(--n)}
.strip figcaption{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:13px;color:var(--m)}
.strip figcaption a{color:var(--e);font-weight:500;text-decoration:none;border-bottom:1px solid var(--c)}
.btn{margin-top:14px;width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:16px;border-radius:999px;border:0;background:var(--e);color:var(--cl);font:500 16px Jost,sans-serif;letter-spacing:.04em;cursor:pointer}
.btn.lt{background:var(--n);color:var(--e)}
.btn:active{transform:scale(.98)}
.hint{margin-top:8px;font-size:12px;line-height:1.45;color:var(--c);text-align:center}
.cap{margin-top:12px;white-space:pre-wrap;font-size:15px;line-height:1.55;background:var(--f);border-radius:16px;padding:16px;color:var(--e)}
ol{margin-top:12px;padding-left:20px;font-size:15px;line-height:1.55;color:var(--e)}
li{margin-bottom:6px}
li b{font-weight:500}
.check{margin-top:24px;display:flex;align-items:center;gap:14px;padding:18px;border-radius:18px;border:1.5px dashed var(--c);background:var(--f);cursor:pointer;user-select:none}
.check input{appearance:none;-webkit-appearance:none;flex:none;width:30px;height:30px;border-radius:9px;border:2px solid var(--c);background:#fff;display:grid;place-items:center;cursor:pointer}
.check input:checked{background:var(--e);border-color:var(--e)}
.check input:checked::after{content:"";width:9px;height:16px;border:solid var(--cl);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-2px)}
.check span{font-size:16px;line-height:1.3}
.check small{display:block;font-size:12px;color:var(--c);margin-top:2px}
.ordem{background:var(--e);color:var(--cl);border-radius:20px;padding:18px;margin-bottom:18px;font-size:14px;line-height:1.5}
.ordem b{font-weight:500;color:var(--n)}
.feitos .item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0;border-bottom:1px solid var(--n)}
.feitos .item:last-child{border-bottom:0}
.feitos .item h3{font-family:"Bodoni Moda",serif;font-weight:400;font-size:22px}
.feitos .item h3 i{color:var(--m)}
.feitos .item p{font-size:12px;color:var(--c);margin-top:4px;letter-spacing:.06em}
.feitos .item button{flex:none;padding:10px 16px;border-radius:999px;border:1.5px solid var(--n);background:#fff;font:400 13px Jost,sans-serif;color:var(--m);cursor:pointer}
.vazio{text-align:center;padding:30px 10px;color:var(--m)}
.vazio b{display:block;font-family:"Bodoni Moda",serif;font-weight:400;font-size:28px;color:var(--e);margin-bottom:8px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,40px);opacity:0;transition:.25s;background:var(--e);color:var(--cl);padding:12px 20px;border-radius:999px;font-size:14px;z-index:9;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.instalar{display:none;position:relative;background:#fff;border:1.5px solid var(--n);border-radius:20px;padding:16px 44px 16px 16px;margin-bottom:18px;font-size:14px;line-height:1.5;color:var(--e)}
.instalar.on{display:block}
.instalar b{font-weight:500}
.instalar .t{display:block;font-family:"Bodoni Moda",serif;font-size:20px;margin-bottom:6px}
.instalar .x{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;border:0;background:var(--f);color:var(--m);font-size:18px;cursor:pointer}
footer{text-align:center;font-family:"Bodoni Moda",serif;font-style:italic;color:var(--m);margin-top:30px}
</style>
</head>
<body>
<div class="wrap">

<script>
// ===== FILA DE TAREFAS (Claude atualiza aqui) =====
// tipo: "post" (post do feed) ou "tarefa" (qualquer outra coisa: destaques, stories, collab...).
// aba: nome curto que aparece na aba.

// O número ("post 1", "post 2"...) é calculado sozinho entre os que ainda não foram postados.
// postado: "AAAA-MM-DD" marca como postado para todo mundo (além da caixinha, que fica salva no celular).
const POSTS = [

    como: [

  },
  {

    telas: ["make-tela1.png","make-tela2.png","make-tela3.png","make-tela4.png","make-tela5.png","make-tela6.png"],

    intro: "O reel está sendo impulsionado, e o Instagram não deixa editar (nem convidar colaborador) enquanto isso. Quando o impulsionamento terminar, faça os passos abaixo. Enquanto isso, compartilhe o reel nos stories do @bestiedalu e guarde no destaque “pijamas”.",
    como: [
      "Confirme que o impulsionamento <b>terminou</b> (Painel profissional → Anúncios).",
      "No <b>@luisalauraa</b>: abra o reel → 3 pontinhos → <b>Editar</b> → <b>Marcar pessoas → Convidar colaborador</b> → <b>@bestiedalu</b>.",
      "No <b>@bestiedalu</b>: abra o direct e <b>aceite o convite</b>.",
      "No @bestiedalu, <b>fixe o reel</b>. Ele vai para o 1º lugar, porque o último fixado aparece primeiro.",
      "Para o “prazer” voltar ao 1º lugar: <b>desafixe o “prazer” e fixe de novo</b>.",
      "Não mexa na legenda do reel, para não atrapalhar o “comenta → link” do ManyChat."
    ],
    legenda: ""

];
// =====================================================

const KEY = "bestie_postados";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const toast = t => { const el = $("#toast"); el.textContent = t; el.classList.add("on"); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("on"), 2200); };

// o que foi marcado na caixinha fica salvo neste celular
let marcados = {};
try { marcados = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch { marcados = {}; }
const salvar = () => { try { localStorage.setItem(KEY, JSON.stringify(marcados)); } catch {} };

// marcações compartilhadas: valem para qualquer pessoa, em qualquer celular
let online = false;
// o que foi marcado/desfeito sem conexão fica na fila e sobe depois
const PEND = "bestie_pendentes";
let pend = {}; try { pend = JSON.parse(localStorage.getItem(PEND) || "{}") || {}; } catch { pend = {}; }
const salvarPend = () => { try { localStorage.setItem(PEND, JSON.stringify(pend)); } catch {} };
async function post(id, data){
  const r = await fetch("/api/postados", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ id, data }) });
  if (!r.ok) throw 0;
  return r.json();
}
async function enviar(id, data){
  try { marcados = await post(id, data); online = true; delete pend[id]; salvarPend(); salvar(); return true; }
  catch { online = false; pend[id] = data; salvarPend(); return false; }
}
async function carregar(){
  try {
    const r = await fetch("/api/postados", { cache: "no-store" });
    if (!r.ok) throw 0;
    let srv = await r.json(); online = true;
    for (const [k, v] of Object.entries(pend)) { srv = await post(k, v); delete pend[k]; }
    salvarPend(); marcados = srv; salvar();
  } catch { online = false; }
  render();
}
const dataDe = p => p.postado || marcados[p.id] || "";
const fila = () => POSTS.filter(p => !dataDe(p));
const feitos = () => POSTS.filter(p => dataDe(p));
const fmt = d => { const [a,m,dd] = d.split("-"); return `${dd}/${m}`; };
const hoje = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); };

let aba = "";

function render(){
  const f = fila(), ok = feitos();
  if (!aba || (aba !== "postados" && !f.find(p => p.id === aba))) aba = f[0] ? f[0].id : "postados";
  $("#tabs").innerHTML =
    f.map((p,i) => `<button data-aba="${p.id}" class="${aba===p.id?"on":""}">${i+1} · ${p.aba||p.id}</button>`).join("") +
    `<button data-aba="postados" class="feito ${aba==="postados"?"on":""}">feitos · ${ok.length}</button>`;

  if (aba === "postados") {
    $("#view").innerHTML = `<section class="post feitos">
      <div class="top"><span class="num">já feitos</span><span class="st ${online?"ok":""}">${online?"vale para todos":"só neste celular"}</span></div>
      ${ok.length ? ok.map(p => `<div class="item"><div><h3>${p.titulo}</h3><p>FEITO EM ${fmt(dataDe(p))}</p></div>
        ${p.postado ? "" : `<button data-desfazer="${p.id}">desfazer</button>`}</div>`).join("")
        : `<div class="vazio"><b>nada ainda</b>quando marcar “já fiz” em uma tarefa, ela aparece aqui.</div>`}
    </section>`;
    return;
  }

  const i = f.findIndex(x => x.id === aba), p = f[i];
  const telas = p.telas.length ? `
    <div class="sec">${p.tipo==="post"?"telas":"imagens"} · ${p.telas.length}</div>
    <div class="strip">${p.telas.map((t,k) => `
      <figure><img src="img/${t}" alt="tela ${k+1}" loading="lazy">
      <figcaption><span>tela ${k+1}</span><a href="img/${t}" download="${t}">baixar</a></figcaption></figure>`).join("")}
    </div>
    <button class="btn" data-save="${p.id}">salvar ${p.telas.length > 1 ? "as " + p.telas.length : "a"} ${p.tipo==="post"?"telas":"imagens"} na galeria</button>
    <p class="hint">no celular abre o menu de compartilhar: toque em “Salvar imagens”.<br>as telas saem em qualidade máxima, sem compressão do WhatsApp.</p>` : "";
  const leg = p.legenda ? `
    <div class="sec">legenda</div>
    <div class="cap">${esc(p.legenda)}</div>
    <button class="btn lt" data-copy="${p.id}">copiar legenda</button>` : "";
  const aviso = i === 0 ? "" : `<div class="ordem">Esta é a tarefa <b>${i+1}</b>. Faça antes ${i === 1 ? "a tarefa <b>1</b>" : `as tarefas <b>1 a ${i}</b>`} e marque “já fiz” ${i === 1 ? "nela" : "nelas"}.</div>`;

  $("#view").innerHTML = `${aviso}<section class="post">
    <div class="top"><span class="num">${p.tipo==="post"?"post":"tarefa"} · ${i+1}${i===0?" · próxima":""}</span><span class="st ${p.status.startsWith("pronto")?"ok":""}">${p.status}</span></div>
    <h2>${p.titulo}</h2>
    ${p.intro ? `<p class="cap">${p.intro}</p>` : ""}
    ${telas}
    ${leg}
    <div class="sec">${p.tipo==="post"?"como postar":"como fazer"}</div>
    <ol>${p.como.map(c => `<li>${c}</li>`).join("")}</ol>
    <label class="check"><input type="checkbox" data-postei="${p.id}"><span>${p.tipo==="post"?"já postei":"já fiz"}<small>vai para “feitos” e a fila anda</small></span></label>
  </section>`;
}
render();
carregar();
document.addEventListener("visibilitychange", () => { if (!document.hidden) carregar(); });

// aviso de instalar: some quando já está instalado ou se ela fechar
const instalado = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
let fechou = false; try { fechou = localStorage.getItem("bestie_aviso_app") === "1"; } catch {}
if (!instalado && !fechou) $("#instalar").classList.add("on");
$("#fechar").onclick = () => { $("#instalar").classList.remove("on"); try { localStorage.setItem("bestie_aviso_app","1"); } catch {} };
// pede ao navegador para não apagar os dados desta página
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch {}

document.addEventListener("click", async e => {
  const t = e.target.closest("[data-aba]");
  if (t) { aba = t.dataset.aba; render(); scrollTo({ top: 0, behavior: "smooth" }); return; }

  const d = e.target.closest("[data-desfazer]");
  if (d) {
    const id = d.dataset.desfazer; delete marcados[id]; salvar(); render();
    toast(await enviar(id, null) ? "voltou para a fila" : "voltou para a fila só neste celular");
    return;
  }

  const c = e.target.closest("[data-copy]");
  if (c) {
    const p = POSTS.find(x => x.id === c.dataset.copy);
    try { await navigator.clipboard.writeText(p.legenda); toast("legenda copiada 🤍"); }
    catch { const r = document.createRange(); r.selectNodeContents(c.previousElementSibling); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("legenda selecionada: toque em copiar"); }
    return;
  }

  const b = e.target.closest("[data-save]");
  if (b) {
    const p = POSTS.find(x => x.id === b.dataset.save);
    const old = b.textContent; b.textContent = "preparando…";
    try {
      const files = await Promise.all(p.telas.map(async t => {
        const r = await fetch("img/" + t); const bl = await r.blob();
        return new File([bl], t, { type: bl.type || "image/png" });
      }));
      if (navigator.canShare && navigator.canShare({ files })) {
        await navigator.share({ files });
      } else {
        files.forEach((f,i) => setTimeout(() => {
          const a = document.createElement("a"); a.href = URL.createObjectURL(f); a.download = f.name; a.click();
        }, i * 400));
        toast("baixando as telas…");
      }
    } catch (err) { if (err && err.name !== "AbortError") toast("use o “baixar” de cada tela"); }
    b.textContent = old;
  }
});

document.addEventListener("change", e => {
  const c = e.target.closest("[data-postei]");
  if (!c || !c.checked) return;
  const id = c.dataset.postei;
  setTimeout(async () => {
    const dia = hoje(); marcados[id] = dia; salvar();
    aba = ""; render(); scrollTo({ top: 0, behavior: "smooth" });
    toast(await enviar(id, dia) ? "foi para feitos ✓" : "marcado só neste celular (sem conexão)");
  }, 450);
});
</script>
</body>
</html>
